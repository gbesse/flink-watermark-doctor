[project]
name = "flink-watermark-doctor"
version = "0.3.1"
description = "Explain event-time watermark behavior with replayable fixtures"
requires-python = ">=3.10"
license = "MIT"

[project.scripts]
watermark-doctor = "watermark_doctor:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["watermark_doctor"]
