name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python watermark_doctor.py examples/cold-partitions.jsonl --partition A --partition B --out-of-order 0 --lang fr
      - run: python watermark_doctor.py examples/cold-partitions.jsonl --partition A --partition B --out-of-order 0 --lang en
      - run: python watermark_doctor.py examples/cold-partitions.jsonl --partition A --partition B --out-of-order 0 --lang es
      - run: pip wheel --no-deps . -w dist
